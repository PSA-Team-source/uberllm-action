name: UberLLM PR Reviewer
description: Review pull request diffs with any chat model on UberLLM or any OpenAI-compatible API, posted as one PR comment.
author: PSA-Team-source
branding:
  icon: message-square
  color: purple
inputs:
  api-key:
    description: API key for base-url (for UberLLM, create one at https://uberllm.dev/dashboard/keys). Store it as a repository secret.
    required: true
  model:
    description: Model id, as listed by GET <base-url>/models. Any chat model works.
    required: false
    default: deepseek/deepseek-v4-pro
  base-url:
    description: OpenAI-compatible base URL (the part before /chat/completions).
    required: false
    default: https://api.uberllm.dev/v1
  max-diff-chars:
    description: Most characters of diff sent to the model. Whole files are kept first; the file that does not fit is cut at a line, and the comment says so.
    required: false
    default: "60000"
  prompt:
    description: System prompt for the review. The default asks for real problems only (bugs, security, data loss), with file, line and a fix.
    required: false
    default: ""
  exclude:
    description: Extra file patterns to leave out, comma or newline separated (e.g. "docs/**, *.generated.ts"). Lock files, minified files, source maps, dist/ and vendor/ are always left out.
    required: false
    default: ""
  max-tokens:
    description: Optional max_tokens for the answer. Empty = the model's default.
    required: false
    default: ""
  post-comment:
    description: Post (or update) the review as a PR comment. "false" only sets the review output and the job summary.
    required: false
    default: "true"
  fail-on-error:
    description: Fail the step when the model or GitHub API errors. Default "false" logs a warning so a review outage never blocks a merge.
    required: false
    default: "false"
  github-token:
    description: Token used to read the diff and write the comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}
outputs:
  review:
    description: The review text (Markdown).
  comment-url:
    description: URL of the PR comment, when one was posted.
runs:
  using: node24
  main: index.js
